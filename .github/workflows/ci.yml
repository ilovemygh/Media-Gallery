name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  rust-core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy lint check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests & spikes
        run: cargo test --workspace
      - name: Parity & 100k benchmark runner
        run: cargo run --release -p parity-runner -- --benchmark-100k

  flutter-and-bindings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Cache FRB & Cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen*
            ~/.cargo/bin/cargo-expand*
            ~/.cargo/bin/cargo-ndk*
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: frb-tools-${{ runner.os }}-2.11.1-v2
      - name: Install FRB codegen & verify bindings up to date
        shell: bash
        run: |
          set -eEo pipefail
          STAGE="init"
          emit_err() {
            local rc=$?
            local line=$1
            local status_out diff_out diff_head frb_tail
            status_out=$(git status --porcelain 2>&1 | head -n 30 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            diff_out=$(git diff --stat 2>&1 | head -n 30 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            diff_head=$(git diff -U1 2>&1 | head -n 30 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            frb_tail=$(tail -n 25 "${RUNNER_TEMP}/frb.log" 2>/dev/null | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g' || true)
            echo "::error::FRB check failed line=${line} rc=${rc} stage=${STAGE}%0AFRB_LOG:%0A${frb_tail}%0ASTATUS:%0A${status_out}%0ADIFFSTAT:%0A${diff_out}%0ADIFFHEAD:%0A${diff_head}"
            exit "$rc"
          }
          trap 'emit_err $LINENO' ERR

          STAGE="install-frb-codegen"
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -q "2.11.1"; then
            mkdir -p ~/.cargo/bin
            curl -fsSL -o "${RUNNER_TEMP}/frb.zip" \
              "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.11.1/flutter_rust_bridge_codegen-x86_64-pc-windows-msvc-v2.11.1.zip"
            echo "5a34b4ba95575b9dac075879ca0fd25bdede60d74260e23dbe75fe3d079e3460 *${RUNNER_TEMP}/frb.zip" | sha256sum -c -
            unzip -o -j "${RUNNER_TEMP}/frb.zip" "flutter_rust_bridge_codegen.exe" -d ~/.cargo/bin/
            chmod +x ~/.cargo/bin/flutter_rust_bridge_codegen.exe
            rm -f "${RUNNER_TEMP}/frb.zip"
          fi
          flutter_rust_bridge_codegen --version | grep -q "2.11.1"
          STAGE="install-cargo-expand"
          if ! command -v cargo-expand >/dev/null 2>&1; then
            cargo install cargo-expand --locked
          fi
          STAGE="flutter-pub-get ($(flutter --version | head -n 1))"
          (cd app && flutter pub get)
          STAGE="frb-generate-1"
          RUSTC_BOOTSTRAP=1 flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml 2>&1 | tee "${RUNNER_TEMP}/frb.log"
          STAGE="frb-generate-2"
          RUSTC_BOOTSTRAP=1 flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml 2>&1 | tee -a "${RUNNER_TEMP}/frb.log"
          STAGE="git-diff-check"
          git add -N app/lib/src/rust crates/core-api/src/frb_generated.rs
          git status --short
          git diff --stat -- app/lib/src/rust crates/core-api/src/frb_generated.rs
          git diff --exit-code -- app/lib/src/rust crates/core-api/src/frb_generated.rs
          STAGE="git-clean-check"
          test -z "$(git status --porcelain)"
      - name: Flutter analyze & widget/golden tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Windows release build
        working-directory: app
        run: flutter build windows --release
      - name: Build Android Rust native libraries
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-ndk -ErrorAction SilentlyContinue)) {
            cargo install cargo-ndk --locked
          }
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $ndkVersion = "28.2.13676358"
          $ndkDir = Join-Path $sdkRoot "ndk\$ndkVersion"
          if (-not (Test-Path $ndkDir)) {
            $sdkMgr = Get-ChildItem "$sdkRoot\cmdline-tools" -Recurse -Filter "sdkmanager.bat" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if (-not $sdkMgr) {
              throw "sdkmanager.bat not found under $sdkRoot\cmdline-tools"
            }
            "y`ny`ny`ny`ny`ny`ny`ny`ny`ny" | & $sdkMgr --licenses | Out-Null
            & $sdkMgr "ndk;$ndkVersion"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:ANDROID_NDK_HOME = $ndkDir
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o app/android/app/src/main/jniLibs build --release -p core-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Android release APK build
        working-directory: app
        run: flutter build apk --release

  legacy-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify read-only legacy tests still pass
        run: |
          npm --prefix legacy ci
          npm --prefix legacy test
