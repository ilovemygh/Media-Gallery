[workspace]
resolver = "2"
members = [
  "crates/core-platform",
  "crates/core-index",
  "crates/core-media",
  "crates/core-net",
  "crates/core-sync",
  "crates/core-ytdl",
  "crates/core-api",
  "tools/parity-runner",
]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
fast_image_resize = "6.1"
flutter_rust_bridge = "=2.11.1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
iroh = "1.4.1"
kamadak-exif = "0.6"
lofty = "0.25"
notify = "8.0"
rand = "0.10"
rayon = "1.12"
reverse_geocoder = "4.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
uuid = { version = "1.20", features = ["v4", "serde"] }
walkdir = "2.5"

core-platform = { path = "crates/core-platform" }
core-index = { path = "crates/core-index" }
core-media = { path = "crates/core-media" }
core-net = { path = "crates/core-net" }
core-sync = { path = "crates/core-sync" }
core-ytdl = { path = "crates/core-ytdl" }
core-api = { path = "crates/core-api" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 4
opt-level = 3
