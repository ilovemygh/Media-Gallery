name: media_gallery
description: Cross-platform visual media explorer, serverless device sync, unified music player, and YouTube downloader.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_rust_bridge: 2.11.1
  desktop_drop: ^0.5.0
  file_picker: ^8.1.4
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  audio_service: ^0.18.15
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
